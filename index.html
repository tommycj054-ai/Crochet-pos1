<!DOCTYPE html>
<html>

<head>

<title>🧶 Crochet POS</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ff7a00">

<link rel="apple-touch-icon" href="icons/icon-192.png">

</head>


<body>


<header>
🧶 Crochet POS
</header>



<nav>

<button onclick="showPage('checkout')">
🛒 Checkout
</button>


<button onclick="showPage('inventory')">
📦 Inventory
</button>


<button onclick="showPage('barcodes')">
🏷️ Barcodes
</button>


<button onclick="showPage('event')">
💵 Event
</button>


<button onclick="showPage('add')">
➕ Add
</button>


<button onclick="showPage('dashboard')">
📊 Dashboard
</button>


</nav>








<!-- CHECKOUT -->

<div id="checkout" class="page">


<h2>
🛒 Checkout
</h2>



<div id="checkoutCamera"></div>


<button class="bigButton" onclick="startCheckoutScanner()">

📷 Scan Barcode

</button>





<h2>
Products
</h2>



<div id="productButtons">

</div>







<h2>
Cart
</h2>


<button class="clearButton" onclick="clearCart()">

🗑 Clear Cart

</button>



<div id="cart">

</div>




<h2>

Total: $

<span id="cartTotal">
0
</span>

</h2>



<button class="bigButton" onclick="completeSale()">

✅ Complete Sale

</button>



</div>









<!-- INVENTORY -->

<div id="inventory" class="page hidden">


<h2>
📦 Inventory
</h2>


<div id="inventoryList">

</div>


</div>









<!-- ADD PRODUCT -->

<div id="add" class="page hidden">


<h2>
➕ Add Product
</h2>


<input id="name" placeholder="Product Name">


<input id="price" placeholder="Price" type="number">


<select id="size">

<option>Small</option>

<option>Normal</option>

<option>Jumbo</option>

</select>


<input id="barcode" placeholder="Barcode">


<input id="stock" placeholder="Stock" type="number">


<input id="photo" type="file" accept="image/*">



<button class="bigButton" onclick="addProduct()">

Add Product

</button>


</div>









<!-- BARCODE PAGE -->

<div id="barcodes" class="page hidden">


<h2>
🏷️ Barcodes
</h2>


<select id="barcodeSelect"></select>


<button onclick="printOneBarcode()">

Print One

</button>


<button onclick="printAllBarcodes()">

Print All

</button>


<div id="barcodePrintArea"></div>


</div>








<!-- EVENT -->

<div id="event" class="page hidden">


<h2>
💵 Craft Show
</h2>


<button onclick="startEvent()">

Start Event

</button>



<p>
Cash:
$<span id="cashSales">0</span>
</p>


<p>
Card:
$<span id="cardSales">0</span>
</p>


<p>
Total:
$<span id="eventTotal">0</span>
</p>



</div>








<!-- DASHBOARD -->

<div id="dashboard" class="page hidden">


<h2>
📊 Dashboard
</h2>


<div class="card">

Products:

<span id="totalProducts">
0
</span>

</div>


<div class="card">

Stock:

<span id="totalStock">
0
</span>

</div>


</div>






<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>


<script src="app.js"></script>


</body>

</html>
